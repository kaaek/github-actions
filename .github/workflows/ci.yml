name: CI
on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.11"
            - name: Install dependencies
              run: pip install --upgrade pip && pip install -r requirements.txt
            - name: Django system check
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
              run: python manage.py check
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build Docker image
              run: docker build -t ghcr.io/kaaek/github-actions:latest .
            - name: Push Docker image
              run: docker push ghcr.io/kaaek/github-actions:latest

    deploy:
        needs: test
        runs-on: [self-hosted, inventory-deploy]
        steps:
            - name: Use isolated Docker config
              run: |
                  mkdir -p "$RUNNER_TEMP/docker-config"
                  echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
            - name: Check Docker
              run: docker info --format "Docker server {{.ServerVersion}} | {{.OSType}}"
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Pull image
              run: docker pull --platform linux/amd64 ghcr.io/kaaek/github-actions:latest
            - name: Deploy
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
              run: |
                  docker rm -f inventory-app 2>/dev/null || true
                  docker run -d --platform linux/amd64 --name inventory-app \
                    -e GEMINI_API_KEY \
                    -p 127.0.0.1:8000:8000 \
                    ghcr.io/kaaek/github-actions:latest
